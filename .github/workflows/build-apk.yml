name: Build APKs (debug)

on:
  push:
    branches: ["arena/01a0a8b3-heart-guard-care", "arena/01a0c7e1-heart-guard-care"]
    paths-ignore: ["apks/**", "build-error-tail.log"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Android platform & build-tools
        run: |
          set -o pipefail
          {
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "PATH=$PATH"
            ls "$ANDROID_SDK_ROOT" || true
            ls "$ANDROID_SDK_ROOT/cmdline-tools" || true
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
            fi
            if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
              echo "sdkmanager not found, trying PATH..."
              SDKMANAGER="sdkmanager"
            fi
            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          } 2>&1 | tee sdk-install.log

      - name: Build debug APKs (mobile + watch)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :mobile:app:assembleDebug :watch:app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Collect APKs
        run: |
          mkdir -p apks
          cp mobile/app/build/outputs/apk/debug/app-debug.apk apks/HeartGuard-mobile-debug.apk
          cp watch/app/build/outputs/apk/debug/app-debug.apk apks/HeartGuard-watch-debug.apk
          ls -lh apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HeartGuard-debug-apks
          path: apks/*.apk

      - name: Commit APKs back to branch
        run: |
          git config user.name "arena-build-bot"
          git config user.email "arena-build-bot@users.noreply.github.com"
          git add -f apks/HeartGuard-mobile-debug.apk apks/HeartGuard-watch-debug.apk
          if git diff --cached --quiet; then
            echo "No APK changes to commit"
            exit 0
          fi
          git commit -m "build: debug APKs (mobile + watch) from CI"
          git push origin HEAD

      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name "arena-build-bot"
          git config user.email "arena-build-bot@users.noreply.github.com"
          { echo "===== SDK INSTALL LOG ====="; tail -c 20000 sdk-install.log 2>/dev/null || echo "(no sdk-install.log)"; echo; echo "===== TAIL OF FAILED BUILD ====="; tail -c 40000 build.log 2>/dev/null || echo "(no build.log)"; } > build-error-tail.log
          git add -f build-error-tail.log
          git commit -m "build: capture failure log" || exit 0
          git push origin HEAD
