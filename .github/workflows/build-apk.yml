name: Build APKs (debug)

on:
  push:
    branches: ["arena/01a0a8b3-heart-guard-care", "arena/01a0c7ca-heart-guard-care", "arena/01a0caf2-heart-guard-care"]
    paths-ignore: ["apks/**", "build-error-tail.log"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Android platform & build-tools
        run: |
          set -o pipefail
          {
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "PATH=$PATH"
            ls "$ANDROID_SDK_ROOT" || true
            ls "$ANDROID_SDK_ROOT/cmdline-tools" || true
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
            fi
            if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
              echo "sdkmanager not found, trying PATH..."
              SDKMANAGER="sdkmanager"
            fi
            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          } 2>&1 | tee sdk-install.log

      - name: Build debug APKs (mobile + watch)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :mobile:app:assembleDebug :watch:app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Collect APKs
        run: |
          mkdir -p apks
          cp mobile/app/build/outputs/apk/debug/app-debug.apk apks/HeartGuard-mobile-debug.apk
          cp watch/app/build/outputs/apk/debug/app-debug.apk apks/HeartGuard-watch-debug.apk
          ls -lh apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HeartGuard-debug-apks
          path: apks/*.apk

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HeartGuard-build-logs
          path: |
            sdk-install.log
            build.log
          if-no-files-found: ignore
